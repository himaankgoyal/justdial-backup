apiVersion: apps/v1
kind: Deployment
metadata: 
  name: db
  labels:
    name: postgres
    app: demo-voting-app
spec:
  replicas: 1
  selector:
    matchLabels:
#      name: postgres-pod
      app: demo-voting-app
  template:
    metadata:
      name: db
      labels:
#        name: postgres-pod
        app: demo-voting-app
    spec:
      containers:
      - name: postgres
        image: postgres
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "POSTGRES"
        - name: POSTGRES_PASSWORD
          value: "POSTGRES"
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: db-data
      volumes:
      - name: db-data
        emptyDir: {} 
